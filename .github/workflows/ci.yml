name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint、型別檢查、Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Scenario 對應檢查
        run: npm run scenarios:check
      - run: npm run build
      - run: npm test
      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-vitest
          path: reports/vitest.json
          if-no-files-found: ignore
          retention-days: 7

  supabase:
    name: pgTAP、Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      # Only the services the app and tests use; the receipt Edge Function is stubbed in E2E.
      - name: Start local Supabase
        run: supabase start -x studio,postgres-meta,edge-runtime,imgproxy,logflare,vector,mailpit,supavisor
      - name: pgTAP
        run: |
          set -o pipefail
          mkdir -p reports
          supabase test db | tee reports/pgtap.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload pgTAP and E2E results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-supabase
          path: |
            reports/pgtap.txt
            reports/e2e.json
          if-no-files-found: ignore
          retention-days: 7

  scenario-report:
    name: Scenario 對照報告
    needs: [check, supabase]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Missing results (a job stopped early) show up as 未執行 in the report.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: results-*
          path: reports
          merge-multiple: true
      - name: Build the report
        run: node scripts/scenario-report.ts --reports reports --summary "$GITHUB_STEP_SUMMARY" --out scenario-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: scenario-report
          path: scenario-report.md
          retention-days: 30

  security:
    name: 相依套件安全檢查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Reads package-lock.json only; fails on high or critical advisories.
      - run: npm audit --audit-level=high
